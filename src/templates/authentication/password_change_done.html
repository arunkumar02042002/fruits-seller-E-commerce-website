{% extends 'base.html' %}
{% load static %}

{% block title %}
{% endblock title %}

{% block css %}
{% endblock css %}

{% block content %}
<div class="container" style="margin: 200px auto;">
    Your password has been changed. Now you can login with your new password.
    <form id="logoutUserForm" action="{% url 'logout' %}" method="POST" style="display: inline;">
        {% csrf_token %}
        <button type="submit" id="#logoutBtn" style="background: none; border: none; display: inline; color: #81c408;">Logout</button>
    </form>
</div>
{% endblock content %}

{% block js %}
<script>
    let logoutUserForm =document.getElementById("logoutUserForm");
    let submitBtn = document.querySelector("#logoutBtn");

    logoutUserForm.addEventListener("submit", () => {
        submitBtn.setAttribute("disabled", "true");
    })
</script>
{% endblock js %}
